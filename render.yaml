services:
  - type: web
    name: the-listening-tree
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: ZHIPUAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
