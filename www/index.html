<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#5B9A7D">
    <title>The Listening Tree</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans HK', sans-serif;
            background: linear-gradient(145deg, #D4E4D9 0%, #E8D5C4 30%, #F0F4F8 60%, #D4DFE8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .loading-card {
            text-align: center;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
        }
        .app-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.6rem;
            color: #1D2939;
            margin-bottom: 8px;
        }
        p {
            color: #475467;
            font-size: 1rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(91,154,125,0.2);
            border-top-color: #5B9A7D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status {
            font-size: 0.85rem;
            color: #98A2B3;
        }
        .retry-btn {
            display: none;
            margin-top: 20px;
            padding: 14px 32px;
            border-radius: 24px;
            border: none;
            background: #5B9A7D;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
        }
        .retry-btn:active { background: #4A8369; }
    </style>
</head>
<body>
    <div class="loading-card">
        <div class="app-icon">🌳</div>
        <h1>The Listening Tree</h1>
        <p>聆聽樹 — Your friendly companion</p>
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">Connecting to server...</div>
        <button class="retry-btn" id="retryBtn" onclick="tryConnect()">Retry Connection</button>
    </div>

    <!-- Capacitor bridge JS — injected by Capacitor at build time -->
    <script src="capacitor.js"></script>
    <script>
        /**
         * This fallback page is shown only when the remote server is
         * unreachable.  Normally Capacitor loads the Flask app directly
         * via the `server.url` config and this page is never seen.
         *
         * If the server is down, we retry every few seconds and show
         * a friendly loading screen.
         */
        const SERVER_URL = 'http://localhost:5000';
        let attempts = 0;

        // Detect Capacitor and add body class for CSS safe-area handling
        if (window.Capacitor) {
            document.body.classList.add('capacitor-app');

            // Initialize Capacitor plugins
            async function initCapacitorPlugins() {
                try {
                    // Import and configure StatusBar
                    const { StatusBar } = await import('@capacitor/status-bar');
                    await StatusBar.setBackgroundColor({ color: '#5B9A7D' });
                    await StatusBar.setStyle({ style: 'LIGHT' });
                } catch (e) { console.log('StatusBar plugin not available:', e); }

                try {
                    // Hide splash screen after load
                    const { SplashScreen } = await import('@capacitor/splash-screen');
                    await SplashScreen.hide();
                } catch (e) { console.log('SplashScreen plugin not available:', e); }

                try {
                    // Handle hardware back button (Android)
                    const { App } = await import('@capacitor/app');
                    App.addListener('backButton', ({ canGoBack }) => {
                        if (canGoBack) {
                            window.history.back();
                        } else {
                            App.exitApp();
                        }
                    });
                } catch (e) { console.log('App plugin not available:', e); }
            }

            initCapacitorPlugins();
        }

        async function tryConnect() {
            attempts++;
            document.getElementById('status').textContent =
                `Connecting to server... (attempt ${attempts})`;
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('retryBtn').style.display = 'none';

            try {
                const resp = await fetch(SERVER_URL + '/login', {
                    method: 'HEAD',
                    mode: 'no-cors',
                    cache: 'no-store',
                });
                // If we get here, server is reachable
                window.location.href = SERVER_URL;
            } catch (e) {
                if (attempts < 10) {
                    setTimeout(tryConnect, 3000);
                } else {
                    document.getElementById('status').textContent =
                        'Cannot connect to server. Please check your connection.';
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('retryBtn').style.display = 'inline-block';
                }
            }
        }

        // Start trying to connect
        tryConnect();
    </script>
</body>
</html>
