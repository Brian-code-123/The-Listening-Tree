name: Playwright Allure Report

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PORT: "5000"
  DATABASE_URL: postgresql://postgres@localhost:5432/ci_db?sslmode=disable
  SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-allure-session-key-0123456789
  ZHIPU_API_KEY: ""
  MINIMAL_STARTUP: "1"
  RUN_LIVE_DB: "1"
  TEST_BASE_URL: http://127.0.0.1:5000
  PYTHONUNBUFFERED: "1"

jobs:
  playwright-allure:
    name: Playwright Tests, Allure, and Pages
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio allure-pytest

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Start application server
        run: |
          python run.py > playwright-server.log 2>&1 &
          echo $! > playwright-server.pid

      - name: Wait for app health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/health/db >/dev/null; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          cat playwright-server.log
          exit 1

      - name: Run Playwright tests with Allure
        id: playwright
        continue-on-error: true
        run: |
          set +e
          PYTHONPATH=. pytest -q tests/test_mobile_fab_position.py --alluredir=allure-results
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-results
            allure-report
            playwright-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Comment PR with Mermaid flow
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_EXIT_CODE: ${{ steps.playwright.outputs.exit_code }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$TEST_EXIT_CODE" = "0" ]; then
            STATUS_LINE="Status: PASS"
          else
            STATUS_LINE="Status: FAIL"
          fi
          export STATUS_LINE

          python scripts/compose_playwright_comment.py /tmp/playwright-allure-comment.md

          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/playwright-allure-comment.md

      - name: Deploy Allure report to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.playwright.outputs.exit_code == '0'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Fail job when Playwright tests fail
        if: always() && steps.playwright.outputs.exit_code != '0'
        run: exit 1