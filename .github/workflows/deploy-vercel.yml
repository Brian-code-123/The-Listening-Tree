name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Precheck Vercel secrets
        id: precheck
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets detected. Proceeding with deploy."
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets missing. Deploy steps will be skipped."
          fi

      - name: Validate Vercel token
        id: token_check
        if: steps.precheck.outputs.has_secrets == 'true'
        continue-on-error: true
        run: |
          npx vercel whoami --token "$VERCEL_TOKEN"

      - name: Mark token validity
        if: steps.precheck.outputs.has_secrets == 'true'
        run: |
          if [ "${{ steps.token_check.outcome }}" = "success" ]; then
            echo "token_valid=true" >> "$GITHUB_ENV"
            echo "Vercel token is valid."
          else
            echo "token_valid=false" >> "$GITHUB_ENV"
            echo "Vercel token is invalid. Deploy steps will be skipped."
          fi

      - name: Setup Python
        if: steps.precheck.outputs.has_secrets == 'true' && env.token_valid == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.precheck.outputs.has_secrets == 'true' && env.token_valid == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        if: steps.precheck.outputs.has_secrets == 'true' && env.token_valid == 'true'
        run: npm install

      - name: Pull Vercel environment
        if: steps.precheck.outputs.has_secrets == 'true' && env.token_valid == 'true'
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build on Vercel
        if: steps.precheck.outputs.has_secrets == 'true' && env.token_valid == 'true'
        run: npx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        if: steps.precheck.outputs.has_secrets == 'true' && env.token_valid == 'true'
        run: npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Skip deploy notice
        if: steps.precheck.outputs.has_secrets != 'true' || env.token_valid != 'true'
        run: echo "Skipping deployment because required Vercel secrets are missing or token is invalid."

  verify-production:
    name: Verify Production Health
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Run production E2E checks
        env:
          VERCEL_PRODUCTION_URL: ${{ secrets.VERCEL_PRODUCTION_URL }}
        run: |
          export VERCEL_E2E_BASE_URL="${VERCEL_PRODUCTION_URL:-https://the-listening-tree.vercel.app}"
          python3 scripts/vercel_e2e_check.py

      - name: Run mobile FAB position E2E test
        env:
          TEST_BASE_URL: ${{ secrets.VERCEL_PRODUCTION_URL || 'https://the-listening-tree.vercel.app' }}/login
        run: |
          python3 tests/test_mobile_fab_position.py
