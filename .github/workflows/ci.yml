name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      ZHIPU_API_KEY: ${{ secrets.CI_ZHIPU_API_KEY }}
      MINIMAL_STARTUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and core flow tests
        run: |
          pytest -q tests/test_basic.py tests/test_core_flows.py tests/test_session_persistence_unit.py

      - name: Python smoke compile
        run: |
          python -m compileall -q run.py api scripts

  capacitor-check:
    name: Capacitor Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm install

      - name: Capacitor doctor
        run: npx cap doctor

      - name: Capacitor Android sync check
        run: npm run ci:mobile
