name: Core Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test:unit

  backend-tests:
    name: Pytest Backend Unit Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      MINIMAL_STARTUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend unit tests (mocked DB, no live DB needed)
        run: pytest -q tests/test_basic.py tests/test_core_flows.py tests/test_session_persistence_unit.py

  integration-tests:
    name: Pytest Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/ci_db?sslmode=disable
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      ZHIPU_API_KEY: ""
      MINIMAL_STARTUP: "1"
      RUN_LIVE_DB: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration tests
        run: PYTHONPATH=. pytest -q tests/integration

  vercel-manifest-check:
    name: Verify api/requirements.txt boots the app
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      MINIMAL_STARTUP: "1"
      # No live DB here — this job only proves the trimmed Vercel manifest
      # has everything import-time needs, not that every route works.
      DATABASE_URL: postgresql://postgres@localhost:5432/unused?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install from the trimmed Vercel manifest, not the root one
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Import run.py — catches a manifest missing something the app needs at import time
        run: python -c "import run"
