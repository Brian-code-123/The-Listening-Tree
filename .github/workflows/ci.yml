name: Comprehensive Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test:unit

  integration-tests:
    name: Pytest Integration Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/ci_db?sslmode=disable
      SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-integration-session-key-0123456789
      ZHIPU_API_KEY: ""
      MINIMAL_STARTUP: "1"
      RUN_LIVE_DB: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run integration tests
        run: PYTHONPATH=. pytest -q tests/integration

  playwright-e2e:
    name: Playwright E2E + HTML Report
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/ci_db?sslmode=disable
      SECRET_KEY: ci-${{ github.run_id }}-${{ github.run_attempt }}-playwright-session-key-0123456789
      ZHIPU_API_KEY: ""
      MINIMAL_STARTUP: "1"
      RUN_LIVE_DB: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5000
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ci_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright trace/video/screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Write Actions summary
        if: always()
        run: |
          {
            echo "### Playwright E2E Summary"
            echo ""
            echo "- HTML report artifact: playwright-report"
            echo "- Raw artifacts: screenshots, videos, traces in test-results"
            echo "- Reporter: html"
            echo ""
            echo '```mermaid'
            echo 'sequenceDiagram'
            echo '    participant CI as GitHub Actions'
            echo '    participant PW as Playwright'
            echo '    participant App as FastAPI'
            echo '    participant DB as PostgreSQL'
            echo '    CI->>PW: run CRUD test suite'
            echo '    PW->>App: create/read/update/delete reminder'
            echo '    App->>DB: persist changes'
            echo '    PW-->>CI: screenshots, trace, video, HTML report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  capacitor-check:
    name: Capacitor Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Capacitor doctor
        run: npx cap doctor

      - name: Capacitor Android sync check
        run: npm run ci:mobile
