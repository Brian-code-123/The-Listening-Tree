<!DOCTYPE html>
<html lang="{{ lang if lang else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ translations.app_name if translations else 'The Listening Tree' }}</title>
    
    <!-- Bootstrap 5 for responsive layout and styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for icons (microphone, send, etc.) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- CSS for recording indicator (blinking red dot) -->
    <style>
        .recording-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: red;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
        }
        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .language-switcher .btn {
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="language-switcher">
        <a href="{{ url_for('set_language', lang='en') }}" class="btn btn-sm {{ 'btn-primary' if lang == 'en' else 'btn-outline-primary' }}">EN</a>
        <a href="{{ url_for('set_language', lang='zh-HK') }}" class="btn btn-sm {{ 'btn-primary' if lang == 'zh-HK' else 'btn-outline-primary' }}">繁中</a>
        <a href="{{ url_for('accessibility_mode') }}" class="btn btn-sm btn-warning"><i class="fas fa-universal-access"></i></a>
        <a href="{{ url_for('guidance') }}" class="btn btn-sm btn-info"><i class="fas fa-question-circle"></i></a>
    </div>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            
            <!-- Main Chat Area -->
            <div class="col-md-10 col-xl-8 chat">
                <div class="card">
                    <!-- Chat Header: Shows bot avatar, name, and logout button -->
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                            <div class="user_info ms-3">
                                <span>{{ translations.app_name if translations else 'The Listening Tree' }}</span>
                                <p>{{ translations.tagline if translations else 'Your friendly companion' }}</p>
                            </div>
                            <a href="{{ url_for('logout') }}" class="ms-auto btn btn-sm btn-danger">{{ translations.logout if translations else 'Logout' }}</a>
                        </div>
                    </div>

                    <!-- Chat Messages Container - Dynamically populated -->
                    <div id="messageFormeight" class="card-body msg_card_body">
                        <!-- Chat history will be loaded here via AJAX on page load -->
                    </div>

                    <!-- Message Input Area -->
                    <div class="card-footer">
                        <form id="messageArea" class="d-flex">
                            <input type="text" id="text" name="msg" placeholder="{{ translations.type_message if translations else 'Type your message...' }}" 
                                   autocomplete="off" class="form-control type_msg" required>
                            
                            <!-- Microphone button - starts voice recording -->
                            <button type="button" id="micBtn" class="send_btn mic-btn" title="{{ translations.start_voice if translations else 'Start Voice' }}">
                                <i class="fas fa-microphone"></i>
                            </button>
                            
                            <!-- Stop button - appears only during recording -->
                            <button type="button" id="stopBtn" class="send_btn stop-btn d-none" title="{{ translations.stop_voice if translations else 'Stop Voice' }}">
                                <i class="fas fa-stop"></i>
                            </button>
                            
                            <!-- Send button - submits text message -->
                            <button type="submit" id="send" class="send_btn" title="{{ translations.send if translations else 'Send' }}">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Sidebar: Reminder Panel -->
            <div class="col-md-2">
                <div class="card h-100" id="notificationPanel">
                    <div class="card-header">Reminders</div>
                    <div class="card-body">
                        <!-- Form to create new reminders -->
                        <form id="reminderForm">
                            <div class="mb-3">
                                <label for="reminderLabel" class="form-label">Reminder</label>
                                <input type="text" class="form-control" id="reminderLabel" 
                                       placeholder="e.g., take medicine" required>
                            </div>
                            <div class="mb-3">
                                <label for="reminderTime" class="form-label">Time (HH:MM)</label>
                                <input type="time" class="form-control" id="reminderTime" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Set Reminder</button>
                        </form>

                        <!-- List of active reminders -->
                        <div id="reminderList" class="mt-3"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function() {
            /**
             * Appends a message bubble to the chat window
             * @param {string} sender - "bot" or "user"
             * @param {string} message - Text content
             * @param {string} time - Formatted time (e.g., "14:35")
             */
            function appendMessage(sender, message, time) {
                const botImg = "{{ url_for('static', filename='Chatbot.png') }}";
                const userImg = "{{ url_for('static', filename='User.png') }}";
                const imgSrc = sender === 'bot' ? botImg : userImg;
                const justify = sender === 'bot' ? 'start' : 'end';
                const msgClass = sender === 'bot' ? 'msg_cotainer' : 'msg_cotainer_send';
                
                const msgHTML = `
                    <div class="d-flex justify-content-${justify} mb-4">
                        ${sender === 'bot' ? `<img src="${imgSrc}" class="rounded-circle user_img">` : ''}
                        <div class="${msgClass}">
                            ${message}
                            <span class="msg_time">${time}</span>
                        </div>
                        ${sender === 'user' ? `<img src="${imgSrc}" class="rounded-circle user_img_msg">` : ''}
                    </div>
                `;
                
                $('#messageFormeight').append(msgHTML);
                $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);
            }

            // Load previous conversation when page loads
            function loadChatHistory() {
                $.get('/get_chat_history', function(data) {
                    data.history.forEach(item => {
                        const time = item.timestamp.split(' ')[1].substring(0, 5); // Extract HH:MM
                        appendMessage(item.sender, item.message, time);
                    });
                });
            }
            loadChatHistory();

            // Handle text message submission
            $('#messageArea').on('submit', function(event) {
                event.preventDefault();
                const text = $('#text').val().trim();
                if (!text) return;

                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                appendMessage('user', text, time);

                $.ajax({
                    type: 'POST',
                    url: '/get_response',
                    data: { msg: text },
                    success: function(data) {
                        appendMessage('bot', data.response, time);
                        $('#text').val('');
                        
                        // Refresh reminder list if user modified reminders via chat
                        if (text.toLowerCase().includes('reminder')) {
                            checkReminders();
                        }
                    },
                    error: function() {
                        alert('Error sending message. Please try again.');
                    }
                });
            });

            // ========== Voice Recording & Transcription ==========
            // Current language from server template
            const currentLang = '{{ lang if lang else "en" }}';
            let mediaRecorder;
            let audioChunks = [];

            $('#micBtn').on('click', function() {
                if (currentLang === 'zh-HK') {
                    // ---- Cantonese: Use browser Web Speech API (zero server deps) ----
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        alert('你的瀏覽器不支援語音辨識，請使用 Chrome 或 Edge。');
                        return;
                    }
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'zh-HK';        // Cantonese
                    recognition.interimResults = false;  // Only final results
                    recognition.continuous = false;      // Stop after one phrase

                    $('#micBtn').addClass('d-none');
                    $('#stopBtn').removeClass('d-none');
                    $('#text').attr('placeholder', '錄音中...')
                              .after('<span class="recording-dot ms-2"></span>');

                    recognition.start();

                    // Store recognition instance so stop button can abort it
                    window._activeRecognition = recognition;

                    recognition.addEventListener('result', function(event) {
                        const text = event.results[0][0].transcript;
                        if (text) {
                            $('#text').val(text);
                            $('#messageArea').submit();
                        }
                    });

                    recognition.addEventListener('error', function(event) {
                        console.error('Speech recognition error:', event.error);
                        if (event.error === 'no-speech') {
                            alert('未偵測到語音，請再試一次。');
                        } else if (event.error === 'not-allowed') {
                            alert('麥克風權限被拒絕，請檢查瀏覽器設定。');
                        }
                    });

                    recognition.addEventListener('end', function() {
                        $('#stopBtn').addClass('d-none');
                        $('#micBtn').removeClass('d-none');
                        $('.recording-dot').remove();
                        $('#text').attr('placeholder', '{{ translations.type_message if translations else "輸入您的訊息..." }}');
                        window._activeRecognition = null;
                    });

                } else {
                    // ---- English: Use Vosk server-side (original, unchanged) ----
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            mediaRecorder = new MediaRecorder(stream);
                            mediaRecorder.start();
                            audioChunks = [];

                            $('#micBtn').addClass('d-none');
                            $('#stopBtn').removeClass('d-none');
                            
                            $('#text').attr('placeholder', 'Recording...')
                                      .after('<span class="recording-dot ms-2"></span>');

                            mediaRecorder.addEventListener('dataavailable', event => {
                                audioChunks.push(event.data);
                            });
                        })
                        .catch(err => {
                            alert('Microphone access denied or unavailable: ' + err);
                        });
                }
            });

            $('#stopBtn').on('click', function() {
                // Stop Cantonese Web Speech API recognition if active
                if (window._activeRecognition) {
                    window._activeRecognition.stop();
                    return;
                }

                // Stop English Vosk recording
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                    mediaRecorder.stream.getTracks().forEach(track => track.stop());

                    $('#stopBtn').addClass('d-none');
                    $('#micBtn').removeClass('d-none');
                    
                    // Remove recording indicator and reset placeholder
                    $('.recording-dot').remove();
                    $('#text').attr('placeholder', '{{ translations.type_message if translations else "Type your message..." }}');

                    mediaRecorder.addEventListener('stop', () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const formData = new FormData();
                        formData.append('audio', audioBlob, 'recording.webm');

                        $.ajax({
                            type: 'POST',
                            url: '/transcribe',
                            data: formData,
                            processData: false,
                            contentType: false,
                            success: function(data) {
                                if (data.text) {
                                    $('#text').val(data.text);
                                    $('#messageArea').submit(); // Auto-send transcribed text
                                } else {
                                    alert(data.error || 'No speech detected. Please try again.');
                                }
                            },
                            error: function(xhr) {
                                let errorMsg = 'Transcription failed. Please try again.';
                                if (xhr.responseJSON && xhr.responseJSON.error) {
                                    errorMsg = xhr.responseJSON.error;
                                }
                                alert(errorMsg);
                            }
                        });
                    });
                }
            });

            // ========== Reminder Management ==========
            function checkReminders() {
                $.get('/get_reminders', function(data) {
                    $('#reminderList').empty();
                    data.reminders.forEach(reminder => {
                        const item = `
                            <div class="reminder-item mb-2 p-2 border rounded ${reminder.active ? '' : 'text-muted'}">
                                ${reminder.label} at ${reminder.time}
                                ${reminder.active ? '<button class="btn btn-danger btn-sm float-end delete-reminder" data-label="' + reminder.label + '">Delete</button>' : '(Done)'}
                            </div>
                        `;
                        $('#reminderList').append(item);
                    });

                    // Bind delete buttons
                    $('.delete-reminder').off('click').on('click', function() {
                        const label = $(this).data('label');
                        $.post('/get_response', { msg: 'delete reminder ' + label }, function(res) {
                            if (res.response.includes('No')) {
                                alert(res.response);
                            }
                            checkReminders();
                        });
                    });
                });
            }
            checkReminders();
            setInterval(checkReminders, 60000); // Refresh list every minute

            // Check for due reminders every minute and trigger alert + sound
            function scheduleReminderCheck() {
                const now = new Date();
                const delay = (60 - now.getSeconds()) * 1000;
                setTimeout(() => {
                    checkForRemindersNow();
                    setInterval(checkForRemindersNow, 60000);
                }, delay);
            }

            function checkForRemindersNow() {
                $.get('/get_reminders', function(data) {
                    const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    data.reminders.forEach(reminder => {
                        if (reminder.time === currentTime && reminder.active) {
                            const audio = new Audio("{{ url_for('static', filename='notification.mp3') }}");
                            audio.loop = true; // Loop the audio until OK is pressed
                            audio.play().catch(err => console.log('Audio play blocked:', err));

                            setTimeout(() => {
                                alert('⏰ Reminder: ' + reminder.label + '!\n\nIt\'s time to ' + reminder.label.toLowerCase() + '!');
                                audio.pause();
                                audio.currentTime = 0;

                                // Deactivate the reminder after confirmation
                                $.post('/deactivate_reminder', { label: reminder.label }, function() {
                                    checkReminders();
                                });
                            }, 300);
                        }
                    });
                });
            }
            scheduleReminderCheck();

            // Submit new reminder from sidebar form
            $('#reminderForm').on('submit', function(e) {
                e.preventDefault();
                const label = $('#reminderLabel').val().trim();
                const time = $('#reminderTime').val();

                if (label && time) {
                    $.post('/get_response', { msg: 'set reminder ' + label + ' ' + time }, function(data) {
                        alert(data.response);
                        $('#reminderLabel').val('');
                        $('#reminderTime').val('');
                        checkReminders();
                    });
                }
            });
        });
    </script>
</body>
</html>
