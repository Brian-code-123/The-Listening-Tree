<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly Companion Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-10 col-xl-8 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                            <div class="user_info ms-3">
                                <span>Elderly Companion Chatbot</span>
                                <p>Your friendly AI companion</p>
                            </div>
                        </div>
                    </div>
                    <div id="messageFormeight" class="card-body msg_card_body">
                        <div class="d-flex justify-content-start mb-4">
                            <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                            <div class="msg_cotainer">
                                Hello! I'm your companion chatbot. How are you feeling today?
                                <span class="msg_time" id="currentTime"></span>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer">
                        <form id="messageArea" class="d-flex">
                            <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required>
                            <button type="button" id="micBtn" class="send_btn mic-btn">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button type="button" id="stopBtn" class="send_btn stop-btn d-none">
                                <i class="fas fa-stop"></i>
                            </button>
                            <button type="submit" id="send" class="send_btn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- Sidebar for Notifications -->
            <div class="col-md-2">
                <div class="card h-100" id="notificationPanel">
                    <div class="card-header">Reminders</div>
                    <div class="card-body">
                        <form id="reminderForm">
                            <div class="mb-3">
                                <label for="reminderLabel" class="form-label">Reminder</label>
                                <input type="text" class="form-control" id="reminderLabel" placeholder="e.g., walk" required>
                            </div>
                            <div class="mb-3">
                                <label for="reminderTime" class="form-label">Time (HH:MM)</label>
                                <input type="time" class="form-control" id="reminderTime" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Set Reminder</button>
                        </form>
                        <div id="reminderList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            $('#currentTime').text(currentTime);

            $('#messageArea').on('submit', function (event) {
                event.preventDefault();
                const user_input = $('#text').val().trim();
                if (user_input === '') return;

                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const userHtml = `
                    <div class="d-flex justify-content-end mb-4">
                        <div class="msg_cotainer_send">${user_input}
                            <span class="msg_time_send">${time}</span>
                        </div>
                        <div class="img_cont_msg">
                            <img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg">
                        </div>
                    </div>
                `;
                $('#messageFormeight').append(userHtml);
                $('#text').val('');
                $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);

                const typingHtml = `
                    <div class="d-flex justify-content-start mb-4">
                        <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                        <div class="msg_cotainer">
                            <div class="typing-indicator">
                                <span></span><span></span><span></span>
                            </div>
                            <span class="msg_time">${time}</span>
                        </div>
                    </div>
                `;
                $('#messageFormeight').append(typingHtml);
                $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);

                $.ajax({
                    type: 'POST',
                    url: '/get_response',
                    data: { msg: user_input },
                    success: function (data) {
                        $('.typing-indicator').parent().parent().remove();
                        const bot_response = data.response;
                        const botHtml = `
                            <div class="d-flex justify-content-start mb-4">
                                <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                                <div class="msg_cotainer">${bot_response}
                                    <span class="msg_time">${time}</span>
                                </div>
                            </div>
                        `;
                        $('#messageFormeight').append(botHtml);
                        $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);
                    },
                    error: function (xhr, status, error) {
                        $('.typing-indicator').parent().parent().remove();
                        console.error("Error getting response:", error);
                        const errorHtml = `
                            <div class="d-flex justify-content-start mb-4">
                                <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                                <div class="msg_cotainer">
                                    I'm having trouble connecting right now. Please try again in a moment.
                                    <span class="msg_time">${time}</span>
                                </div>
                            </div>
                        `;
                        $('#messageFormeight').append(errorHtml);
                        $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);
                    }
                });
            });

            $('#text').focus();

            // Voice recording with manual control and stop button
            let recorder, audioChunks = [], isRecording = false;
            $('#micBtn').on('click', function () {
                if (!isRecording) {
                    navigator.mediaDevices.getUserMedia({ audio: true })
                        .then(stream => {
                            recorder = new MediaRecorder(stream);
                            recorder.start();
                            audioChunks = [];
                            isRecording = true;
                            $('#micBtn').addClass('recording');
                            $('#stopBtn').removeClass('d-none');
                            recorder.ondataavailable = e => audioChunks.push(e.data);
                        })
                        .catch(err => {
                            console.error('Mic access error:', err);
                            alert('Please allow microphone access.');
                        });
                } else {
                    stopRecording();
                }
            });

            $('#stopBtn').on('click', function () {
                stopRecording();
            });

            function stopRecording() {
                if (recorder && isRecording) {
                    recorder.stop();
                    isRecording = false;
                    $('#micBtn').removeClass('recording');
                    $('#stopBtn').addClass('d-none');
                    recorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        sendAudio(blob);
                    };
                }
            }

            function sendAudio(blob) {
                const formData = new FormData();
                formData.append('audio', blob, 'recording.webm');
                $.ajax({
                    type: 'POST',
                    url: '/transcribe',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (data) {
                        if (data.text) {
                            $('#text').val(data.text);
                            $('#messageArea').submit();
                        } else {
                            alert('No speech detected. Try again.');
                        }
                    },
                    error: function () {
                        alert('Error transcribing audio.');
                    }
                });
            }

            // Notification handling
            function checkReminders() {
                $.get('/get_reminders', function (data) {
                    $('#reminderList').empty();
                    data.reminders.forEach(reminder => {
                        $('#reminderList').append(`
                            <div class="reminder-item">
                                ${reminder.label} at ${reminder.time}
                                <button class="btn btn-danger btn-sm float-end delete-reminder" data-label="${reminder.label}">Delete</button>
                            </div>
                        `);
                    });
                    $('.delete-reminder').on('click', function () {
                        const label = $(this).data('label');
                        $.ajax({
                            type: 'POST',
                            url: '/get_response',
                            data: { msg: `delete reminder ${label}` },
                            success: function (data) {
                                alert(data.response);
                                checkReminders(); // Refresh list
                            },
                            error: function () {
                                alert('Error deleting reminder.');
                            }
                        });
                    });
                });
                setTimeout(checkReminders, 60000); // Check every minute
            }
            checkReminders();

            // Audio/popup alert
            setInterval(() => {
                $.get('/get_reminders', function (data) {
                    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    data.reminders.forEach(reminder => {
                        if (reminder.time === now && reminder.active) {
                            alert(`Reminder: ${reminder.label}! Time to ${reminder.label.split(' ')[0]}!`);
                            const audio = new Audio('{{ url_for("static", filename="notification.mp3") }}');
                            audio.play().catch(err => console.log("Audio play failed:", err));
                        }
                    });
                });
            }, 60000);

            $('#reminderForm').on('submit', function (event) {
                event.preventDefault();
                const label = $('#reminderLabel').val().trim();
                const time = $('#reminderTime').val();
                if (label && time) {
                    $.ajax({
                        type: 'POST',
                        url: '/get_response',
                        data: { msg: `set reminder ${label} ${time}` },
                        success: function (data) {
                            $('#reminderLabel').val('');
                            $('#reminderTime').val('');
                            alert(data.response);
                            checkReminders(); // Refresh list immediately
                        },
                        error: function () {
                            alert('Error setting reminder.');
                        }
                    });
                }
            });
        });
    </script>
</body>
</html>
