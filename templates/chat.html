<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly Companion Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-10 col-xl-8 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                            <div class="user_info ms-3">
                                <span>Elderly Companion Chatbot</span>
                                <p>Your friendly AI companion</p>
                            </div>
                            <a href="{{ url_for('logout') }}" class="ms-auto btn btn-sm btn-danger">Logout</a>
                        </div>
                    </div>
                    <div id="messageFormeight" class="card-body msg_card_body">
                        <!-- Chat history will be loaded here -->
                    </div>
                    <div class="card-footer">
                        <form id="messageArea" class="d-flex">
                            <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required>
                            <button type="button" id="micBtn" class="send_btn mic-btn">
                                <i class="fas fa-microphone"></i>
                            </button>
                            <button type="button" id="stopBtn" class="send_btn stop-btn d-none">
                                <i class="fas fa-stop"></i>
                            </button>
                            <button type="submit" id="send" class="send_btn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <!-- Sidebar for Notifications -->
            <div class="col-md-2">
                <div class="card h-100" id="notificationPanel">
                    <div class="card-header">Reminders</div>
                    <div class="card-body">
                        <form id="reminderForm">
                            <div class="mb-3">
                                <label for="reminderLabel" class="form-label">Reminder</label>
                                <input type="text" class="form-control" id="reminderLabel" placeholder="e.g., walk" required>
                            </div>
                            <div class="mb-3">
                                <label for="reminderTime" class="form-label">Time (HH:MM)</label>
                                <input type="time" class="form-control" id="reminderTime" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Set Reminder</button>
                        </form>
                        <div id="reminderList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    $(document).ready(function () {
        function appendMessage(sender, message, time) {
            const imgSrc = sender === 'bot' ? "{{ url_for('static', filename='Chatbot.png') }}" : 'https://via.placeholder.com/50?text=User';
            const justify = sender === 'bot' ? 'start' : 'end';
            const msgClass = sender === 'bot' ? 'msg_cotainer' : 'msg_cotainer_send';
            const msg = `
                <div class="d-flex justify-content-${justify} mb-4">
                    ${sender === 'bot' ? `<img src="${imgSrc}" class="rounded-circle user_img">` : ''}
                    <div class="${msgClass}">
                        ${message}
                        <span class="msg_time">${time}</span>
                    </div>
                    ${sender !== 'bot' ? `<img src="${imgSrc}" class="rounded-circle user_img_msg">` : ''}
                </div>
            `;
            $('#messageFormeight').append(msg).scrollTop($('#messageFormeight')[0].scrollHeight);
        }

        // Load chat history on page load
        function loadChatHistory() {
            $.get('/get_chat_history', function (data) {
                data.history.forEach(item => {
                    appendMessage(item.sender, item.message, item.timestamp.split(' ')[1]);
                });
            });
        }
        loadChatHistory();

        // Update time (unchanged)
        function updateTime() {
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            $('#currentTime').text(now);
        }
        setInterval(updateTime, 60000);
        updateTime();

        // Handle text input (unchanged, but refresh reminders and history if needed)
        $('#messageArea').on('submit', function (event) {
            event.preventDefault();
            const text = $('#text').val().trim();
            if (text) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                appendMessage('user', text, time);
                $.ajax({
                    type: 'POST',
                    url: '/get_response',
                    data: { msg: text },
                    success: function (data) {
                        appendMessage('bot', data.response, time);
                        $('#text').val('');

                        if (text.toLowerCase().startsWith('set reminder') || text.toLowerCase().startsWith('delete reminder')) {
                            checkReminders();
                        }
                    },
                    error: function () {
                        alert('Error sending message.');
                    }
                });
            }
        });

        // Voice input (unchanged)
        let mediaRecorder;
        let audioChunks = [];

        $('#micBtn').on('click', function () {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();
                $('#micBtn').addClass('d-none');
                $('#stopBtn').removeClass('d-none');
                audioChunks = [];
                mediaRecorder.addEventListener("dataavailable", event => {
                    audioChunks.push(event.data);
                });
            }).catch(err => {
                alert('Microphone access denied or error: ' + err);
            });
        });

        $('#stopBtn').on('click', function () {
            mediaRecorder.stop();
            $('#stopBtn').addClass('d-none');
            $('#micBtn').removeClass('d-none');
            mediaRecorder.addEventListener("stop", () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                $.ajax({
                    type: 'POST',
                    url: '/transcribe',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function (data) {
                        if (data.text) {
                            $('#text').val(data.text);
                            $('#messageArea').submit();
                        } else {
                            alert('No speech detected. Try again.');
                        }
                    },
                    error: function () {
                        alert('Error transcribing audio.');
                    }
                });
            });
        });

        // Notification handling (unchanged)
        function checkReminders() {
            $.get('/get_reminders', function (data) {
                $('#reminderList').empty();
                data.reminders.forEach(reminder => {
                    $('#reminderList').append(`
                        <div class="reminder-item">
                            ${reminder.label} at ${reminder.time}
                            <button class="btn btn-danger btn-sm float-end delete-reminder" data-label="${reminder.label}">Delete</button>
                        </div>
                    `);
                });
                $('.delete-reminder').on('click', function () {
                    const label = $(this).data('label');
                    $.ajax({
                        type: 'POST',
                        url: '/get_response',
                        data: { msg: `delete reminder ${label}` },
                        success: function (data) {
                            alert(data.response);
                            checkReminders();
                        },
                        error: function () {
                            alert('Error deleting reminder.');
                        }
                    });
                });
            });
        }
        checkReminders();
        setInterval(checkReminders, 60000);

        // Audio/popup alert (unchanged)
        setInterval(() => {
            $.get('/get_reminders', function (data) {
                const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                data.reminders.forEach(reminder => {
                    if (reminder.time === now && reminder.active) {
                        alert(`Reminder: ${reminder.label}! Time to ${reminder.label.split(' ')[0]}!`);
                        const audio = new Audio('{{ url_for("static", filename="notification.mp3") }}');
                        audio.play().catch(err => console.log("Audio play failed:", err));
                    }
                });
            });
        }, 60000);

        $('#reminderForm').on('submit', function (event) {
            event.preventDefault();
            const label = $('#reminderLabel').val().trim();
            const time = $('#reminderTime').val();
            if (label && time) {
                $.ajax({
                    type: 'POST',
                    url: '/get_response',
                    data: { msg: `set reminder ${label} ${time}` },
                    success: function (data) {
                        $('#reminderLabel').val('');
                        $('#reminderTime').val('');
                        alert(data.response);
                        checkReminders();
                    },
                    error: function () {
                        alert('Error setting reminder.');
                    }
                });
            }
        });
    });
    </script>
</body>
</html>
