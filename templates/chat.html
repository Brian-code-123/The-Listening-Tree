<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elderly Companion Chatbot</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
   
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">		
            <div class="col-md-10 col-xl-8 chat">
                <div class="card">
                    <!-- Chat Header -->
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                            <div class="user_info ms-3">
                                <span>Elderly Companion Chatbot</span>
                                <p>Your friendly AI companion</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Chat Body -->
                    <div id="messageFormeight" class="card-body msg_card_body">
                        <!-- Initial welcome message -->
                        <div class="d-flex justify-content-start mb-4">
                            <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                            <div class="msg_cotainer">
                                Hello! I'm your companion chatbot. How are you feeling today?
                                <span class="msg_time" id="currentTime"></span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Chat Footer -->
                    <div class="card-footer">
                        <form id="messageArea" class="d-flex">
                            <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required>
                            <button type="submit" id="send" class="send_btn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            // Set current time for initial message
            const currentTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            $('#currentTime').text(currentTime);
            
            // Handle form submission
            $('#messageArea').on('submit', function(event) {
                event.preventDefault();
                const user_input = $('#text').val().trim();
                if (user_input === '') return;

                // Get current time
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // User message HTML
                const userHtml = `
                    <div class="d-flex justify-content-end mb-4">
                        <div class="msg_cotainer_send">${user_input}
                            <span class="msg_time_send">${time}</span>
                        </div>
                        <div class="img_cont_msg">
                            <img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg">
                        </div>
                    </div>
                `;

                // Append user message and clear input
                $('#messageFormeight').append(userHtml);
                $('#text').val('');
                $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);

                // Show typing indicator
                const typingHtml = `
                    <div class="d-flex justify-content-start mb-4">
                        <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                        <div class="msg_cotainer">
                            <div class="typing-indicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <span class="msg_time">${time}</span>
                        </div>
                    </div>
                `;
                $('#messageFormeight').append(typingHtml);
                $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);

                // Send AJAX request to backend
                $.ajax({
                    type: 'POST',
                    url: '/get_response',
                    data: { msg: user_input },
                    success: function(data) {
                        // Remove typing indicator
                        $('.typing-indicator').parent().parent().remove();
                        
                        const bot_response = data.response;

                        // Bot message HTML
                        const botHtml = `
                            <div class="d-flex justify-content-start mb-4">
                                <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                                <div class="msg_cotainer">${bot_response}
                                    <span class="msg_time">${time}</span>
                                </div>
                            </div>
                        `;

                        // Append bot response
                        $('#messageFormeight').append(botHtml);
                        $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);
                    },
                    error: function(xhr, status, error) {
                        // Remove typing indicator
                        $('.typing-indicator').parent().parent().remove();
                        
                        console.error("Error getting response:", error);
                        
                        // Error message HTML
                        const errorHtml = `
                            <div class="d-flex justify-content-start mb-4">
                                <img src="{{ url_for('static', filename='Chatbot.png') }}" class="rounded-circle user_img">
                                <div class="msg_cotainer">
                                    I'm having trouble connecting right now. Please try again in a moment.
                                    <span class="msg_time">${time}</span>
                                </div>
                            </div>
                        `;
                        
                        $('#messageFormeight').append(errorHtml);
                        $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);
                    }
                });
            });
            
            // Auto-focus on input when page loads
            $('#text').focus();
        });
    </script>
</body>
</html>
